<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code of Legend</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-container">
        <h1 class="logo">Code of Legend</h1>
        <p class="logo-sub">Real-time Algorithm Arena</p>

        <div class="auth-tabs">
            <button class="tab active" data-tab="login">Login</button>
            <button class="tab" data-tab="register">Register</button>
        </div>

        <form id="login-form" class="auth-form">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <form id="register-form" class="auth-form hidden">
            <input type="text" name="username" placeholder="Username (3-20 chars)" required minlength="3" maxlength="20">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password (8+ chars)" required minlength="8">
            <button type="submit">Sign Up</button>
        </form>

        <div id="error-msg" class="error-msg hidden"></div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
