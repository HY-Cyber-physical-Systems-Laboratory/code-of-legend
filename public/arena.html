<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code of Legend - Arena</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo">Arena</div>
        <div id="timer" class="nav-timer">10:00</div>
        <div class="nav-right">
            <button id="leave-btn" class="btn-sm">Leave</button>
        </div>
    </nav>

    <main class="arena">
        <!-- Sidebar: Players + HP -->
        <aside class="arena-sidebar">
            <h3>Battle</h3>
            <div id="player-cards"></div>
        </aside>

        <div class="arena-split">
            <!-- Left: Problems -->
            <div class="problem-panel">
                <div id="problem-tabs" class="problem-tabs"></div>
                <div id="problem-body" class="problem-body"></div>
            </div>

            <!-- Right: Monaco Editor -->
            <div class="editor-panel">
                <div class="editor-toolbar">
                    <select id="lang-select">
                        <option value="python" selected>Python</option>
                    </select>
                    <button id="reset-btn" class="btn-sm">Reset</button>
                </div>
                <div id="monaco-container"></div>
                <div class="editor-footer">
                    <span id="editor-status" class="editor-status"></span>
                    <span id="judge-msg" class="judge-msg"></span>
                    <button id="submit-btn" class="btn-submit">Submit</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Death Overlay -->
    <div id="death-overlay" class="game-overlay hidden">
        <div class="overlay-content">
            <h1 class="death-title">사망하셨습니다</h1>
            <p class="overlay-sub">HP가 0이 되었습니다</p>
            <div class="overlay-stats">
                <span>Score: <b id="death-score">0</b></span>
            </div>
            <button class="btn-lobby" onclick="location.href='/main.html'">Back to Lobby</button>
        </div>
    </div>

    <!-- Victory Overlay -->
    <div id="victory-overlay" class="game-overlay hidden">
        <div class="overlay-content">
            <h1 class="victory-title">Victory!</h1>
            <p class="overlay-sub">상대를 처치했습니다</p>
            <div class="overlay-stats">
                <span>Score: <b id="victory-score">0</b></span>
            </div>
            <button class="btn-lobby" onclick="location.href='/main.html'">Back to Lobby</button>
        </div>
    </div>

    <!-- Time Over Overlay -->
    <div id="timeover-overlay" class="game-overlay hidden">
        <div class="overlay-content">
            <h1 id="timeover-title"></h1>
            <p id="timeover-msg" class="overlay-sub"></p>
            <div class="overlay-stats">
                <span>Your Score: <b id="timeover-score">0</b></span>
            </div>
            <button class="btn-lobby" onclick="location.href='/main.html'">Back to Lobby</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/arena.js"></script>
</body>
</html>
